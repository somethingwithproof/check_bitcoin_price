minimum_pre_commit_version: "4.0.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-ast
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff
        name: Ruff (locked)
        entry: mise exec -- uv run --frozen --no-sync --no-build ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format (locked)
        entry: mise exec -- uv run --frozen --no-sync --no-build ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: Mypy (locked)
        entry: mise exec -- uv run --frozen --no-sync --no-build mypy check_bitcoin_price scripts
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: security-audit
        name: Source and dependency audit (locked)
        entry: mise run audit
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.11
    hooks:
      - id: actionlint

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "check-bitcoin-price"
dynamic = ["version"]
description = "A Nagios plugin to monitor Bitcoin price"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Thomas Vincent"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
keywords = ["nagios", "monitoring", "bitcoin", "cryptocurrency", "plugin"]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "responses>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-requests>=2.28.0",
    "hatchling>=1.27.0",
    "bandit[toml]>=1.9.4",
    "pip-audit>=2.10.0",
    "pre-commit>=4.0.0",
    "twine>=6.0.0",
]

[project.scripts]
check_bitcoin_price = "check_bitcoin_price.plugin:main"

[project.urls]
Homepage = "https://github.com/somethingwithproof/check_bitcoin_price"
Repository = "https://github.com/somethingwithproof/check_bitcoin_price"
Issues = "https://github.com/somethingwithproof/check_bitcoin_price/issues"

[tool.hatch.version]
path = "check_bitcoin_price/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/check_bitcoin_price", "/tests", "/scripts", "/packaging", "/mise.toml", "/CONTRIBUTING.md", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["check_bitcoin_price"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["check_bitcoin_price"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=check_bitcoin_price --cov-report=term-missing"

[tool.coverage.run]
source = ["check_bitcoin_price"]
branch = true

[tool.coverage.report]
fail_under = 98
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

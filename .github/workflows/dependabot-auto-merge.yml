---
name: Dependabot Auto-Merge

"on":
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge Dependabot pull requests with successful checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --author "app/dependabot" \
            --json number,isDraft,mergeable,headRefOid \
            --jq '.[] |
              select(.isDraft == false and .mergeable == "MERGEABLE") |
              "\(.number) \(.headRefOid)"' |
          while read -r pr head_sha; do
            [ -n "$pr" ] || continue

            if ! states=$(gh pr checks "$pr" \
              --repo "$GITHUB_REPOSITORY" \
              --json bucket \
              --jq '.[].bucket'); then
              continue
            fi

            # Fail closed when a repository has no CI checks.
            [ -n "$states" ] || continue

            if grep -Evq '^(pass|skipping)$' <<<"$states"; then
              continue
            fi

            gh pr merge "$pr" \
              --repo "$GITHUB_REPOSITORY" \
              --squash \
              --delete-branch \
              --match-head-commit "$head_sha"
          done

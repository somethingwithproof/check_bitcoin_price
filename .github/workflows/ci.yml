name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.6"
      - name: Install locked binary dependencies
        run: uv sync --frozen --group dev --no-build --no-install-project
      - name: Check lockfile
        run: uv lock --check
      - name: Check formatting
        run: .venv/bin/python -m ruff format --check check_bitcoin_price tests scripts
      - name: Lint
        run: .venv/bin/python -m ruff check check_bitcoin_price tests scripts
      - name: Type check
        run: .venv/bin/python -m mypy check_bitcoin_price scripts

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.6"
      - name: Install locked binary dependencies
        run: uv sync --frozen --group dev --no-build --no-install-project
      - name: Check lockfile
        run: uv lock --check
      - name: Run tests
        run: .venv/bin/python -m pytest --cov=check_bitcoin_price --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.10.6"
      - name: Install locked binary dependencies
        run: uv sync --frozen --group dev --no-build --no-install-project
      - name: Build distributions with the locked backend
        run: uv build --clear --no-build-isolation
      - name: Validate package metadata
        run: .venv/bin/python -m twine check --strict dist/*
      - name: Verify installed wheel outside the source tree
        run: |
          uv venv "$RUNNER_TEMP/package-smoke"
          uv pip install --python "$RUNNER_TEMP/package-smoke/bin/python" --no-deps --no-build dist/*.whl
          uv export --quiet --frozen --no-dev --no-emit-project --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/package-smoke/bin/python" --no-build --require-hashes -r "$RUNNER_TEMP/runtime-requirements.txt"
          cd "$RUNNER_TEMP"
          package-smoke/bin/check_bitcoin_price --version
          package-smoke/bin/check_bitcoin_price --help
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.10.6"
      - name: Install locked binary dependencies
        run: uv sync --frozen --group dev --no-build --no-install-project
      - name: Scan Python source
        run: .venv/bin/python -m bandit -c pyproject.toml -r check_bitcoin_price scripts
      - name: Audit locked runtime dependencies
        run: |
          uv export --quiet --frozen --no-dev --no-emit-project --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          .venv/bin/python -m pip_audit --disable-pip --require-hashes -r "$RUNNER_TEMP/runtime-requirements.txt"

  native-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.2"
      - name: Build native packages and checksums
        run: mise run package
      - name: Test Debian and RPM installation
        run: bash scripts/test_native_packages.sh

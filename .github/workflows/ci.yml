name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.6"
      - name: Install locked binary dependencies
        run: uv sync --frozen --all-extras --no-build --no-install-project
      - name: Check lockfile
        run: uv lock --check
      - name: Check formatting
        run: .venv/bin/python -m ruff format --check check_bitcoin_price tests
      - name: Lint
        run: .venv/bin/python -m ruff check check_bitcoin_price tests
      - name: Type check
        run: .venv/bin/python -m mypy check_bitcoin_price --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.6"
      - name: Install locked binary dependencies
        run: uv sync --frozen --all-extras --no-build --no-install-project
      - name: Check lockfile
        run: uv lock --check
      - name: Run tests
        run: .venv/bin/python -m pytest --cov=check_bitcoin_price --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
